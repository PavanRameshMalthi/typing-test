<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#logo-grad)" stroke-width="4" filter="url(#glow)" opacity="0.8"/>
  <!-- Keyboard outline -->
  <path d="M 25 40 L 75 40 A 5 5 0 0 1 80 45 L 80 65 A 5 5 0 0 1 75 70 L 25 70 A 5 5 0 0 1 20 65 L 20 45 A 5 5 0 0 1 25 40 Z" fill="none" stroke="url(#logo-grad)" stroke-width="3" />
  <!-- Keys (dots and lines) -->
  <rect x="26" y="46" width="6" height="4" rx="1" fill="url(#logo-grad)" />
  <rect x="36" y="46" width="6" height="4" rx="1" fill="url(#logo-grad)" />
  <rect x="46" y="46" width="6" height="4" rx="1" fill="url(#logo-grad)" />
  <rect x="56" y="46" width="6" height="4" rx="1" fill="url(#logo-grad)" />
  <rect x="66" y="46" width="6" height="4" rx="1" fill="url(#logo-grad)" />
  
  <rect x="28" y="53" width="6" height="4" rx="1" fill="url(#logo-grad)" />
  <rect x="38" y="53" width="6" height="4" rx="1" fill="url(#logo-grad)" />
  <rect x="48" y="53" width="6" height="4" rx="1" fill="url(#logo-grad)" />
  <rect x="58" y="53" width="6" height="4" rx="1" fill="url(#logo-grad)" />
  <rect x="68" y="53" width="6" height="4" rx="1" fill="url(#logo-grad)" />
  
  <!-- Spacebar -->
  <rect x="35" y="60" width="30" height="4" rx="1" fill="url(#logo-grad)" />
  <!-- Speed lightning bolt -->
  <path d="M 50 20 L 65 35 L 53 35 L 58 50 L 35 30 L 47 30 Z" fill="url(#logo-grad)" opacity="0.9" filter="url(#glow)"/>
</svg>
